name: Registry Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-update
  cancel-in-progress: false

jobs:
  build:
    name: Build registry packages
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore GroundKit.slnx

      - name: Build solution
        run: dotnet build GroundKit.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test GroundKit.slnx --no-build --configuration Release

      - name: Validate and build registry definitions
        run: |
          dotnet run --project src/groundkit-registry --no-build --configuration Release -- \
            validate --dir registry/packages
          dotnet run --project src/groundkit-registry --no-build --configuration Release -- \
            build-all --dir registry/packages --output ./dist-packages

      - name: Upload registry packages
        uses: actions/upload-artifact@v7
        with:
          name: groundkit-registry-${{ github.run_id }}
          path: ./dist-packages/*.db
          if-no-files-found: error
          retention-days: 14
