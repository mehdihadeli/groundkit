# https://johanneskonings.dev/github/2021/02/28/github_automatic_releases_and-changelog/
# https://tiagomichaelsousa.dev/articles/stop-writing-your-changelogs-manually
name: Release Drafter

on:
  push:
    branches:
      - "main"

jobs:
  update-release-draft:
    name: Release drafter
    runs-on: ubuntu-latest

    permissions:
      # write permission is required to create a github release
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NBGV CLI
        run: dotnet tool install --tool-path "$RUNNER_TEMP/nbgv" nbgv --version 3.10.94

      - name: Calculate release version
        id: version
        shell: bash
        run: echo "version=$($RUNNER_TEMP/nbgv/nbgv get-version -v NuGetPackageVersion)" >> "$GITHUB_OUTPUT"

      - name: Update Release Draft
        uses: release-drafter/release-drafter@v7
        id: semantic
        with:
          config-name: release-drafter.yml
          disable-autolabeler: true
          version: ${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          tag: v${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
